<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>带派游戏库</title>
    <!-- 保持你的状态栏黑色 -->
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="https://twoyears666.github.io/game/ios.png">

    <style>
        /* --- 基础样式 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212; color: #fff; padding-bottom: 80px;
        }
        
        /* --- 卡片样式 --- */
        .card { 
            background-color: #1e1e1e; margin: 15px; padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .card-desc { font-size: 0.9rem; color: #aaa; }

        /* --- 下拉菜单样式 --- */
        .dropdown-menu { display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        .dropdown-menu a { 
            display: block; padding: 12px; background: #2c2c2c; color: #fff; 
            text-decoration: none; border-radius: 8px; font-size: 1rem; text-align: center;
            transition: background 0.2s;
        }
        .dropdown-menu a:active { background: #444; }

        /* --- 添加按钮样式 --- */
        .add-card { 
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            height: 120px; background-color: #252525; border: 2px dashed #444;
        }
        .add-icon { font-size: 2rem; margin-bottom: 10px; }
        .add-text { font-size: 1rem; color: #888; }

        /* --- 弹窗样式 --- */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content { 
            background-color: #1e1e1e; padding: 20px; border-radius: 12px; width: 85%; max-width: 400px;
        }
        .modal-input { 
            width: 100%; padding: 10px; margin: 10px 0; background: #333; border: none; 
            border-radius: 6px; color: #fff;
        }
        .modal-btn { 
            width: 100%; padding: 12px; background: #007aff; color: #fff; border: none; 
            border-radius: 6px; font-size: 1rem; margin-top: 10px;
        }

        /* --- 游戏全屏层 --- */
        #game-container {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; flex-direction: column;
        }
        #game-frame {
            width: 100%; height: 100%; border: none;
        }
        .close-game {
            position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2);
            color: #fff; padding: 5px 10px; border-radius: 4px; text-decoration: none; z-index: 2001;
        }
    </style>
</head>
<body>

    <!-- 你的原始头部卡片 -->
    <div class="card">
        <div class="card-title">游戏库</div>
        <div class="card-desc">点击展开列表</div>
    </div>

    <!-- 你的原始游戏菜单 -->
    <div class="dropdown-menu">
        <a href="#" onclick="openGame('mc1.12.html')">1.12 - 无法更改</a>
        <a href="#" onclick="openGame('mc1.8.8.html')">1.8.8 - 可更改</a>
        <a href="#" onclick="openGame('mc1.5.2.html')">1.5.2 - 无法更改</a>
        <h2 style="color:#888; margin:10px 15px;">其他</h2>
        <a href="#" onclick="openGame('snowrider3D')">snowrider3D</a>
    </div>

    <!-- 你的原始添加按钮 -->
    <div class="card add-card" onclick="openAddModal()">
        <div class="add-icon">+</div>
        <div class="add-text">添加游戏</div>
    </div>

    <!-- 添加游戏的弹窗 -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>添加新游戏</h3>
            <input type="text" id="gameName" class="modal-input" placeholder="游戏名称 (如: 超级玛丽)">
            <input type="text" id="gameUrl" class="modal-input" placeholder="网页链接 (如: game.html)">
            <button class="modal-btn" onclick="addGame()">确认添加</button>
            <button class="modal-btn" style="background:#444; margin-top:5px;" onclick="closeAddModal()">取消</button>
        </div>
    </div>

    <!-- 游戏全屏容器 -->
    <div id="game-container">
        <a href="#" class="close-game" onclick="closeGame()">关闭</a>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        // --- 1. 弹窗逻辑 ---
        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

        // --- 2. 添加游戏逻辑 ---
        function addGame() {
            const name = document.getElementById('gameName').value.trim();
            const url = document.getElementById('gameUrl').value.trim();

            if (name && url) {
                const menu = document.querySelector('.dropdown-menu');
                const newLink = document.createElement('a');
                newLink.href = "#";
                newLink.innerText = name;
                // 核心修改：给新添加的链接绑定打开游戏的功能
                newLink.onclick = function() { openGame(url); };
                
                menu.appendChild(newLink);
                closeAddModal();
                document.getElementById('gameName').value = '';
                document.getElementById('gameUrl').value = '';
                
                // 自动触发缓存
                precachePage(url);
            }
        }

        // --- 3. 打开游戏逻辑 (iframe模式) ---
        function openGame(url) {
            const frame = document.getElementById('game-frame');
            frame.src = url;
            document.getElementById('game-container').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('game-frame').src = ''; // 清空src以停止游戏运行
        }

        // --- 4. 自动缓存逻辑 (核心部分) ---
        
        // 这里定义你原本截图里的所有链接
        // 只要加在这里，或者通过上面添加按钮加进去的，都会被缓存
        const initialGames = [
            'mc1.12.html',
            'mc1.8.8.html',
            'mc1.5.2.html',
            'snowrider3D' // 假设这是个文件夹或html
        ];

        function precachePage(url) {
            // 使用 fetch 悄悄下载页面
            fetch(url, { cache: "force-cache" }) 
                .then(response => {
                    if(response.ok) console.log('✅ 已缓存:', url);
                })
                .catch(err => console.log('ℹ️ 离线或已缓存:', url));
        }

        // 页面加载时，预加载所有初始游戏
        window.addEventListener('load', () => {
            initialGames.forEach(precachePage);
        });

    </script>
</body>
</html>
